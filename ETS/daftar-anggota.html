<body>
<nav class="navbar navbar-expand-lg sticky-top" id="navUtama">
<div class="container">
<a class="navbar-brand brand" href="index.html">LibraryReg</a>
<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Buka menu"><span class="navbar-toggler-icon"></span></button>

</ul></div></div></nav>

<main class="halaman"><div class="container">
<div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
<div><h1 class="h2 mb-1">Daftar anggota</h1><p class="text-secondary mb-0" id="jumlah" aria-live="polite"></p></div>
<div class="d-flex gap-2"><input type="search" id="cari" class="form-control" style="min-width:260px" placeholder="Cari nama atau NIM/NIP" aria-label="Cari nama atau NIM/NIP"><a class="btn btn-brass text-nowrap" href="pendaftaran.html">Tambah anggota</a></div></div>
<div class="panel p-0"><div class="table-responsive"><table class="table table-hover mb-0">
<thead><tr><th>No. anggota</th><th>Nama</th><th>NIM/NIP</th><th>Jenis</th><th class="text-end">Aksi</th></tr></thead>
<tbody id="tbody"></tbody></table></div></div></div></main>

<div class="modal fade" id="modalLihat" tabindex="-1" aria-labelledby="jLihat" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
<div class="modal-header"><h2 class="modal-title h5" id="jLihat">Detail anggota</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button></div>
<div class="modal-body"><div id="kartuDetail" class="mb-4"></div><dl class="row mb-0" id="detailList"></dl></div></div></div></div>

<div class="modal fade" id="modalEdit" tabindex="-1" aria-labelledby="jEdit" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content">
<div class="modal-header"><h2 class="modal-title h5" id="jEdit">Edit data anggota</h2><button class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button></div>
<div class="modal-body"><form id="formEdit"></form></div>
<div class="modal-footer"><button class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button><button class="btn btn-green" id="btnSimpan">Simpan perubahan</button></div></div></div></div>
<script src="vendor/bootstrap.bundle.min.js"></script>
<script src="vendor/sweetalert2.min.js"></script>
<script src="js/app.js"></script>
<script src="js/dashboard.js"></script>
