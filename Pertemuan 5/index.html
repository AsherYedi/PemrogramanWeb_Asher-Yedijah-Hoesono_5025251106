<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Student Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <a class="brand" href="#">
        <svg class="icon icon-lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 10 12 5 2 10l10 5 10-5z" fill="currentColor"/><path d="M6 12.5V17c3 2.2 9 2.2 12 0v-4.5"/></svg>
        <span>Student Management</span>
    </a>
    <nav class="nav-menu" aria-label="Navigasi utama">
        <a href="#">Home</a>
        <a href="#" aria-current="page">Students</a>
        <a href="#">About</a>
        <span class="avatar" role="img" aria-label="Profil pengguna">
            <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6" fill="currentColor"/></svg>
        </span>
    </nav>
</header>

<main class="container">

    <!-- KOLOM KIRI: FORM STUDENT -->
    <section class="card" aria-labelledby="form-title">
        <h2 id="form-title">Form Student</h2>

        <form id="student-form" novalidate>
            <div class="form-group">
                <label for="nim">NIM</label>
                <input type="text" id="nim" name="nim" placeholder="Masukkan NIM" inputmode="numeric" autocomplete="off">
                <small class="error" data-for="nim"></small>
            </div>

            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" autocomplete="off">
                <small class="error" data-for="nama"></small>
            </div>

            <div class="form-group">
                <label for="jurusan">Jurusan</label>
                <select id="jurusan" name="jurusan">
                    <option value="">Pilih Jurusan</option>
                    <option>Informatika</option>
                    <option>Sistem Informasi</option>
                    <option>Teknik Komputer</option>
                    <option>Manajemen</option>
                </select>
                <small class="error" data-for="jurusan"></small>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Masukkan email" autocomplete="off">
                <small class="error" data-for="email"></small>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
                    Simpan
                </button>
                <button type="button" class="btn btn-secondary" id="btn-cancel">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>
                    Batal
                </button>
                <button type="button" class="btn btn-danger" id="btn-reset">
                    <svg class="icon" viewBox="0 0 24 24"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/></svg>
                    Reset
                </button>
            </div>
            <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
        </form>
    </section>

    <!-- KOLOM KANAN: DATA MAHASISWA -->
    <section class="card" aria-labelledby="table-title">
        <div class="table-header">
            <h2 id="table-title">Data Mahasiswa</h2>
            <form class="search-box" id="search-form" role="search">
                <input type="search" id="search" placeholder="Cari mahasiswa..." aria-label="Cari mahasiswa">
                <button type="submit" class="btn-search" aria-label="Cari">
                    <svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.7-4.7"/></svg>
                </button>
            </form>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th class="col-no">No</th>
                        <th>NIM</th>
                        <th>Nama</th>
                        <th>Jurusan</th>
                        <th>Email</th>
                        <th class="col-aksi">Aksi</th>
                    </tr>
                </thead>
                <tbody id="student-body"></tbody>
            </table>
        </div>

        <div class="table-footer">
            <p class="info" id="info"></p>
            <nav class="pagination" id="pagination" aria-label="Paginasi"></nav>
        </div>
    </section>

</main>

<script src="js/app.js"></script>
</body>
</html>
